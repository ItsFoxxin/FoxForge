name: Release checks
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - run: git diff --check
      - run: python -m compileall -q foxforge ci
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r deployment/requirements-runtime.txt
  tests:
    needs: validation
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - run: python -m pip install '.[dev]' PyYAML
      - run: python -m pytest -q
  packaging:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - run: python -m pip install '.[dev]'
      - run: python -m build
      - run: python -m pip download -d /tmp/wheelhouse -r deployment/requirements-runtime.txt
      - run: python ci/check_distribution.py --wheelhouse /tmp/wheelhouse
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: foxforge-0.4.0, path: dist/*}
  containers:
    needs: packaging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: docker build -t foxforge:0.4.0 .
      - run: sudo python3 ci/container_smoke.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - run: python -m pip install '.[dev]'
      - run: docker build -f Dockerfile.worker -t foxforge-worker:0.4.0 .
      - run: python ci/worker_smoke.py
