[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "foxforge"
version = "0.2.0"
description = "Local-first deterministic multi-agent coding orchestrator for Qwen Code"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "ItsFoxxin" }
]
dependencies = ["PyJWT[crypto]>=2.10,<3"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "build>=1.2,<2",
    "wheel>=0.43",
]

[project.scripts]
foxforge = "foxforge.coordinator:main"

[tool.setuptools.packages.find]
include = ["foxforge*"]

[tool.setuptools.data-files]
"share/foxforge" = ["templates/qwen-settings.json"]
"share/foxforge/qwen-agents" = ["templates/qwen-agents/*.md"]
"share/foxforge/scripts" = ["scripts/install-target.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
